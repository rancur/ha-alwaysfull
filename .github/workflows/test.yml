name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read, not empty. An empty permissions block leaves the job with no
# `contents` scope at all, so `actions/checkout` cannot clone -- which
# bites on the very first run, before anyone has a green build to
# compare against. Read is the least this needs and no more.
permissions:
  contents: read

env:
  # One place to change it. See the `python-version` matrix below for why
  # there is currently only one value to change.
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # The rule set is pinned explicitly in pyproject.toml. `ruff check .`
      # therefore means the same thing here as it does locally, which is the
      # entire reason it is pinned.
      - name: ruff
        run: ruff check .

      # `ruff format --check` is deliberately NOT run. This repository is
      # hand-formatted at 120 columns and ruff's formatter would rewrite 31
      # of its 42 files; adopting it is a decision to make on purpose, in
      # its own commit, not something to discover as a red CI job.
      - name: mypy
        run: mypy

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 ONLY, and the brief for this task asked for 3.13 as well.
        # It cannot be done: homeassistant 2026.9.2 declares
        # `Requires-Python: >=3.14.2` and
        # pytest-homeassistant-custom-component 0.13.365 declares
        # `>=3.14`, so a 3.13 job does not fail a test -- it fails `pip
        # install` before a test is collected, which is a red job that
        # tells nobody anything.
        #
        # This is a matrix rather than a bare value so the day 3.15 is
        # supported it is one line, and so the shape of the question stays
        # visible.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: pytest
        # `--snapshot-warn-unused` is NOT passed. An unused snapshot means
        # an entity stopped being produced, which is exactly the kind of
        # silent regression the 140 snapshots exist to catch, so it stays
        # an error.
        run: pytest -q --cov=custom_components.alwaysfull --cov-report=term-missing

  floor:
    # The `homeassistant` key in hacs.json is a promise: HACS refuses to install
    # for anyone below it. This job is what keeps that promise honest. It pins the
    # oldest supported Home Assistant and runs the whole suite against it, using
    # the pytest-homeassistant-custom-component build released for exactly that
    # core version -- a mismatched harness reports hundreds of spurious errors and
    # tells you nothing.
    #
    # It exists because the declared floor was once wrong: it claimed a core newer
    # than the maintainer's own instance, which is the one version anybody had
    # actually run it on. HACS correctly refused to download it.
    name: pytest (oldest supported Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Read the declared floor from hacs.json
        id: floor
        run: echo "ha=$(python -c "import json;print(json.load(open('hacs.json'))['homeassistant'])")" >> "$GITHUB_OUTPUT"
      - name: Install the harness built for that exact core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest-homeassistant-custom-component==0.13.357"
      - name: Fail if the installed core is not the declared floor
        run: |
          installed=$(python -c "from homeassistant.const import __version__ as v; print(v)")
          echo "declared=${{ steps.floor.outputs.ha }} installed=$installed"
          test "$installed" = "${{ steps.floor.outputs.ha }}"
      - run: python -m pytest -q
